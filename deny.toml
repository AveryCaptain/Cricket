[graph]
all-features = false

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "CDLA-Permissive-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
]
