[package]
name = "cricket-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cricket-gateway = { path = "../cricket-gateway" }
cricket-memory = { path = "../cricket-memory" }
cricket-protocol = { path = "../cricket-protocol" }
cricket-skills = { path = "../cricket-skills" }
cricket-tools = { path = "../cricket-tools" }
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
